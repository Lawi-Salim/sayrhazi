id: lawibrahim
input:
  required:
    - sayrhazi.yaml
    - AGENTS.md
  optional:
    - features
output:
  report: plan.txt
  contains:
    - task_id
    - agent
    - completed_at
    - summary
    - date
    - sujet
    - decision
    - raisonnement
    - statut
  verdicts:
    - À IMPLÉMENTER
    - INFORMATIF
    - VALIDÉ
permissions:
  code: none
rules:
  - ecriture plan.txt uniquement apres confirmation explicite
  - archivage feature bouclée vers features sans écraser
