# Schéma de rapport Sayrhazi (référence normative ; application stricte : lots automation).
# Tout rapport porte task_id + agent + status + completed_at + summary.
# Horodatage : `completed_at` (ISO 8601) uniquement. L'ancien champ `version`
# comme horodatage est refusé (confusion avec workflow.version).
# Statuts par rôle (vérifiés par engine/report.py, espaces et underscores acceptés) :
# architect (plan.txt) : À IMPLÉMENTER, INFORMATIF, VALIDÉ
# designer (design.txt) : PROPOSÉ, VALIDÉ
# builder (build.txt) : EN COURS, TERMINÉ, BLOQUÉ
# reviewer/security (review.txt, security.txt) : VALIDÉ, VALIDÉ AVEC RÉSERVES, CORRECTIONS NÉCESSAIRES
# qa (qa.txt) : VALIDÉ, VALIDÉ AVEC RÉSERVES, CORRECTIONS NÉCESSAIRES, À COMPLÉTER
# TERMINÉ décrit l'achèvement du travail, VALIDÉ décrit un verdict : ne pas les mélanger.
report:
  required: [task_id, agent, status, completed_at, summary]
  fields:
    task_id: {type: string, stable: true}
    agent: {type: role}
    status: {enum: [À IMPLÉMENTER, INFORMATIF, EN COURS, TERMINÉ, BLOQUÉ, PROPOSÉ, VALIDÉ, VALIDÉ AVEC RÉSERVES, VALIDÉ_AVEC_RÉSERVES, CORRECTIONS NÉCESSAIRES, CORRECTIONS_NÉCESSAIRES, À COMPLÉTER]}
    completed_at: {type: datetime}
    summary: {type: string}
    next_agents: {type: list, items: role, optional: true}
