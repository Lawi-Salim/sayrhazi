# Workflow Sayrhazi de référence (Lot 2, contrat déclaratif).
# Versionné avec le projet en `.opencode/workflow.yaml` : parcours lisible par
# l'humain, sans règles dispersées dans le code. Les étapes désignent des rôles
# stables (architect, designer, builder, reviewer, security, qa), jamais des
# noms d'affichage. Validateur : engine/workflow.py. Modèle projet :
# runtimes/opencode/templates/workflow.yaml.
# Sont automatiques : review (toujours), security et visual_qa (si requis),
# rework (retour vers builder sur CORRECTIONS). `auto: false` = humain.
workflow:
  mode: supervised
  auto_start: false
  max_parallel_agents: 3

stages:
  - id: implementation
    agent: builder
    trigger:
      report: plan.txt
      status: VALIDÉ
    auto: false

  - id: design
    agent: designer
    condition: design_required
    trigger:
      report: plan.txt
      status: VALIDÉ
    auto: false

  - id: review
    agent: reviewer
    trigger:
      report: build.txt
      status: TERMINÉ
    auto: true

  - id: security
    agent: security
    condition: security_required
    trigger:
      report: build.txt
      status: TERMINÉ
    auto: true

  - id: visual_qa
    agent: qa
    condition: visual_qa_required
    trigger:
      report: build.txt
      status: TERMINÉ
    auto: true

  - id: rework
    agent: builder
    trigger:
      report: review.txt
      status: CORRECTIONS NÉCESSAIRES
    auto: true
