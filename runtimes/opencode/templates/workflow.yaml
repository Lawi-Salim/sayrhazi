# Workflow Sayrhazi du projet (contrat déclaratif, Lot 2).
# Copié dans `.opencode/workflow.yaml` à l'installation, jamais écrasé ensuite.
# Les étapes désignent des rôles stables, jamais des noms d'affichage.
# `auto: true` = transition prise en charge par le watcher ; `auto: false` =
# orchestration humaine. Aujourd'hui seule `review` est automatique.
# Vérifié par `tunda sayrhazi` (présence + validité, jamais bloquant).
workflow:
  mode: supervised
  auto_start: false
  max_parallel_agents: 3

stages:
  - id: implementation
    agent: builder
    trigger:
      report: plan.txt
      status: VALIDÉ
    auto: false

  - id: design
    agent: designer
    condition: design_required
    trigger:
      report: plan.txt
      status: VALIDÉ
    auto: false

  - id: review
    agent: reviewer
    trigger:
      report: build.txt
      status: TERMINÉ
    auto: true

  - id: security
    agent: security
    condition: security_required
    trigger:
      report: build.txt
      status: TERMINÉ
    auto: false

  - id: visual_qa
    agent: qa
    condition: visual_qa_required
    trigger:
      report: build.txt
      status: TERMINÉ
    auto: false
